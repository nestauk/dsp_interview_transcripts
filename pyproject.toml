[tool.poetry]
name = "dsp-interview-transcripts"
version = "0.1.0"
description = ""
authors = ["Karlis Kanders <karlis.kanders@nesta.org.uk>"]
readme = "README.md"
packages = [
    { include = "dsp_interview_transcripts" },
]


[tool.poetry.dependencies]
python = "^3.11"
dash-auth = "^2.3.0"

[tool.poetry.group.core]
optional = true

[tool.poetry.group.core.dependencies]
llvmlite = "^0.43.0"
bertopic = "^0.16.3"
sentence-transformers = "^3.1.1"
torch = { version = "^2.4.0+cpu", source = "pytorch-cpu" }
scikit-learn = "^1.5.2"
jupyter = "^1.1.1"
python-dotenv = "^1.0.1"
matplotlib = "^3.9.2"
altair = "^5.4.1"
emoji = "^2.13.2"
ftfy = "^6.2.3"
streamlit = "^1.39.0"
nltk = "^3.9.1"
numpy = "<2.0"
transformers = "^4.45.2"
wordcloud = "^1.9.3"
seaborn = "^0.13.2"
openpyxl = "^3.1.5"
langchain = "^0.3.7"
s3fs = "^2024.10.0"
plac = "^1.4.3"
python-docx = "^1.1.2"
sentencepiece = "^0.2.0"
quarto = "^0.1.0"
langchain-community = "^0.3.13"
discovery-utils = {git = "https://github.com/nestauk/discovery_utils.git", rev = "llm-dependencies"}
dash = "^3.0.2"
dash-bootstrap-components = "^2.0.0"

[tool.poetry.group.app]
optional = true

[tool.poetry.group.app.dependencies]
llvmlite = "^0.43.0"
bertopic = "^0.16.3"
sentence-transformers = "^3.1.1"
torch = { version = "^2.4.0+cpu", source = "pytorch-cpu" }
python-dotenv = "^1.0.1"
emoji = "^2.13.2"
ftfy = "^6.2.3"
nltk = "^3.9.1"
numpy = "<2.0"
openpyxl = "^3.1.5"
langchain = "^0.3.7"
plac = "^1.4.3"
langchain-community = "^0.3.13"
discovery-utils = {git = "https://github.com/nestauk/discovery_utils.git", rev = "llm-dependencies", extras = ["llm"]}
dash = "^3.0.2"
dash-bootstrap-components = "^2.0.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^7.1.1" # Allows for testing of the project
pytest-cov = "^4.0.0" # Allows to run coverage of the project
moto = "^3.1.6" # Allows for mocking of AWS services

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
flake8 = "^4.0.1"                         # Style Guide Enforcement
pyproject-flake8 = "^0.0.1-alpha.4"       # Allows configuration of flake 8 from pyproject.toml
flake8-bugbear = "^22.3.23"               # Finding likely bugs and design problems in your program.
flake8-print = "^4.0.0"                   # Check for print statements in python files.
flake8-docstrings = "^1.6.0"              # Include checks provided by pep257.
flake8-annotations = "^2.8.0"             # check for presence of type annotations in function definitions.
isort = "^5.10.1"                         # Sort imports
yamllint = "^1.26.3"                      # Linter for YAML files
bandit = {version = "^1.7.4", extras = ["toml"]}  # Security linter
pre-commit = "^2.18.1"                   # Runs a pipeline before commiting code
black = "^22.6.0"                         # Python style checks


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
notebook = "^7.2.1"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.env
  | \.vscode
  | build
  | dist
  | \.mypy_cache
)\
'''

[tool.isort]
profile = 'black'
force_single_line = true
combine_as_imports = true
lines_between_types = 1
lines_after_imports = 2
src_paths = ["dsp_interview_transcripts", "tests"]
line_length = 119

[tool.bandit]
skips = [      # Choose the bandit errors to ignore globally
  "B101",      # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
  "B104",      # Possible binding to all interfaces
]
exclude_dirs = [
  ".venv",
]

[tool.pytest.ini_options]
minversion = "7.1"
addopts = """
  --verbose
  --color=yes
  --assert=plain
  --cov-report term
  --cov=dsp_interview_transcripts
  --last-failed
"""
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = ["*/tests/*"]    # Remove test files from coverage run.

[tool.coverage.report]
omit = ["*/tests/*"]    # Remove test files from coverage report.
